# The rules file (design §4). Every threshold the engine uses lives here, with
# its reason and source. The values are the C6 starting values the user
# approved on 2026-10-29. Changing one is a new engine version, logged in
# CLAUDE.md. These rules decide whether a METHOD suits the data; they never
# decide what a metadata column is (that comes only from the column guide).
rules_version: "2026-10-29.2"
rules:
  R-PREV:   {value: 0.10, reason: "Feature kept for per-feature tests if present in at least this share of samples in at least one group", source: "rule of thumb, unverified"}
  R-MINGRP: {value: 3,    reason: "Smallest group size for any test; below it, description and effect sizes only", source: "rule of thumb, unverified"}
  R-MINSIM: {value: 10,   reason: "Smallest reference group to fit the simulator (override rule, E4)", source: "rule of thumb, unverified (catalogue D20)"}
  R-GEE:    {value: 40,   reason: "Fewest subjects for GEE sandwich errors to be trusted", source: "rule of thumb, unverified"}
  R-RE:     {value: 5,    reason: "Fewest levels for a random effect to be estimated", source: "rule of thumb, unverified (catalogue D18)"}
  R-FDR:    {value: 0.10, reason: "FDR level for a lead (exploratory survey, C18)", source: "user decision C18"}
  R-CAL:    {value: 2,    reason: "A method fails calibration if its simulated FDR exceeds this multiple of R-FDR", source: "rule of thumb, unverified"}
  R-DIAG:   {value: 0.20, reason: "Share of features failing residual checks before the whole question moves to the fallback", source: "rule of thumb, unverified"}
  R-AGREE:  {value: 0.667, reason: "Agreement: at least this share of the agreement set give the same direction and a call", source: "rule of thumb, unverified"}
  R-SIMREP: {value: 100,  reason: "Simulation repeats per candidate method", source: "rule of thumb, unverified"}
  # Added at E3 (CLAUDE.md D13): the thresholds the residual checks and
  # fallbacks need. Diagnostic thresholds only; never applied to the p-value
  # of the effect being studied.
  R-DIAGP:  {value: 0.05, reason: "A residual check (DHARMa uniformity, dispersion, zero-inflation; betadisper) fails below this p-value", source: "rule of thumb, unverified (DHARMa default)"}
  R-SKEW:   {value: 1.0,  reason: "A linear-model check fails when the residuals' skewness exceeds this in absolute value", source: "rule of thumb, unverified"}
  R-VARRATIO: {value: 4, reason: "A linear-model check fails when one group's residual variance exceeds the other's by this factor", source: "rule of thumb, unverified"}
  R-UNBAL:  {value: 1.5,  reason: "Groups are unbalanced when the larger is more than this many times the smaller (PERMANOVA with betadisper, design section 6)", source: "rule of thumb, unverified"}
  R-PERM:   {value: 999,  reason: "Permutations for PERMANOVA, betadisper and permutation tests", source: "convention"}
  R-BOOT:   {value: 199,  reason: "Resamples for mvabund", source: "convention; kept low for run time"}
  R-PSEUDO: {value: 0.5,  reason: "Pseudocount added before the centred log-ratio for the Wilcoxon and camera agreement methods", source: "convention"}
  R-SEED:   {value: 20261029, reason: "Seed for every step that uses random numbers; each step adds a fixed offset", source: "engine convention"}
